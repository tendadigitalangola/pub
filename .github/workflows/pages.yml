name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify Cyber Parceiros public page
        shell: bash
        run: |
          url="${{ steps.deployment.outputs.page_url }}cyber-parceiros/"
          for attempt in {1..12}; do
            if body="$(curl --fail --silent --show-error --location --max-time 20 "$url")"; then
              if grep -q "PROCURANDO" <<<"$body" \
                && grep -q "Cyber Parceiros" <<<"$body" \
                && grep -q "925 430 609" <<<"$body"; then
                echo "Public page verified: $url"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Public page verification failed: $url" >&2
          exit 1
      - name: Verify Poligest 3.15 public page
        shell: bash
        run: |
          base="${{ steps.deployment.outputs.page_url }}poligest-3-15/"
          for attempt in {1..12}; do
            if body="$(curl --fail --silent --show-error --location --max-time 20 "$base")" \
              && grep -q "POLIGEST 3.15" <<<"$body" \
              && grep -q "Portal do Estudante" <<<"$body" \
              && grep -q "Relatório executivo diário" <<<"$body" \
              && grep -q 'class="scene"' <<<"$body" \
              && grep -q 'class="card"' <<<"$body" \
              && grep -q 'id="launchCarousel"' <<<"$body" \
              && grep -q 'id="launchNext"' <<<"$body" \
              && grep -q 'setInterval' <<<"$body" \
              && ! grep -q "cards.webp" <<<"$body" \
              && grep -q "assets/poligest-logo.png?v=2" <<<"$body" \
              && grep -q "assets/favicon.png?v=2" <<<"$body" \
              && curl --fail --silent --show-error --location --max-time 20 "${base}assets/poligest-logo.png?v=2" -o /tmp/poligest-logo.png \
              && curl --fail --silent --show-error --location --max-time 20 "${base}assets/favicon.png?v=2" -o /tmp/poligest-favicon.png \
              && test "$(wc -c < /tmp/poligest-logo.png)" -gt 1000 \
              && test "$(wc -c < /tmp/poligest-favicon.png)" -gt 1000; then
                echo "Poligest 3.15 native-render carousel verified: $base"
                exit 0
            fi
            sleep 5
          done
          echo "Poligest 3.15 verification failed: $base" >&2
          exit 1
