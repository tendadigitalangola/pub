name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify Cyber Parceiros public page
        shell: bash
        run: |
          url="${{ steps.deployment.outputs.page_url }}cyber-parceiros/"
          for attempt in {1..12}; do
            if body="$(curl --fail --silent --show-error --location --max-time 20 "$url")"; then
              if grep -q "PROCURANDO" <<<"$body" \
                && grep -q "Cyber Parceiros" <<<"$body" \
                && grep -q "925 430 609" <<<"$body"; then
                echo "Public page verified: $url"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Public page verification failed: $url" >&2
          exit 1
      - name: Verify Poligest links point to official 3.16 landing
        shell: bash
        run: |
          official="https://www.poligest.ao/novidades/poligest-3-16/"
          base="${{ steps.deployment.outputs.page_url }}"
          for attempt in {1..12}; do
            old="$(curl --fail --silent --show-error --max-time 20 "${base}poligest-3-15/" || true)"
            current="$(curl --fail --silent --show-error --max-time 20 "${base}poligest-3-16/" || true)"
            if grep -q "$official" <<<"$old" \
              && grep -q "$official" <<<"$current" \
              && grep -q 'rel="canonical"' <<<"$old" \
              && grep -q 'rel="canonical"' <<<"$current"; then
              echo "Poligest GitHub Pages aliases point to official 3.16 landing."
              exit 0
            fi
            sleep 5
          done
          echo "Poligest redirect verification failed." >&2
          exit 1
