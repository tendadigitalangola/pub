<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Publicações oficiais da Tenda Digital.">
  <title>Tenda Digital — Publicações</title>
  <style>
    :root{--red:#f00;--ink:#171717;--muted:#666;--line:#e9e9e9;--soft:#f7f7f7}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#fff}main{max-width:960px;margin:auto;padding:72px 24px}header{margin-bottom:48px}.eyebrow{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.75rem;color:var(--red)}h1{font-size:clamp(2.4rem,6vw,4.4rem);line-height:1;margin:.5rem 0 1rem;letter-spacing:-.045em}p{color:var(--muted);line-height:1.7;font-size:1.05rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{display:block;border:1px solid var(--line);border-radius:20px;padding:28px;color:inherit;text-decoration:none;transition:.2s ease}.card:hover{transform:translateY(-2px);border-color:#d5d5d5;box-shadow:0 14px 38px rgba(0,0,0,.06)}.card strong{display:block;font-size:1.25rem;margin-bottom:8px}.tag{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:750;color:#333;background:var(--soft);padding:8px 10px;border-radius:999px;margin-top:18px}.dot{width:8px;height:8px;border-radius:50%;background:var(--red)}footer{margin-top:64px;border-top:1px solid var(--line);padding-top:24px;font-size:.9rem;color:#777}
  </style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Tenda Digital</div>
    <h1>Publicações oficiais</h1>
    <p>Área pública para páginas, campanhas e outros artefactos digitais da Tenda Digital.</p>
  </header>
  <section class="grid" aria-label="Publicações disponíveis">
    <a class="card" href="./cyber-parceiros/">
      <strong>Cyber Parceiros</strong>
      <p>Programa de parceiros e agentes de vendas do Cyber Agrafos.</p>
      <span class="tag"><span class="dot"></span>Ver landing page</span>
    </a>
  </section>
  <footer>© Tenda Digital, Lda.</footer>
</main>
</body>
</html>
